name: Motor de blog (SEO/GEO)

# Corre cada domingo 13:00 UTC (8:00 Colombia).
# También se lanza a mano desde Actions → "Run workflow".
on:
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      command:
        description: "Qué ejecutar"
        required: true
        default: "run"
        type: choice
        options: [ideas, run]

permissions:
  contents: write

jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias del motor
        working-directory: motor
        run: npm install

      - name: Ejecutar agentes (idean + redactan + generan HTML)
        working-directory: motor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: "https://pimenton.io"
          MAX_POSTS_PER_RUN: "1"
        run: npm run ${{ github.event.inputs.command || 'run' }}

      - name: Publicar blogs (commit a main)
        run: |
          git config user.name "motor-blog[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/blog public/en/blog public/sitemap-blog.xml motor/data data/blog-teasers 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "blog: nuevos posts generados por el motor"
            # main pudo avanzar (hotfix/copy) mientras el motor corría
            git pull --rebase origin main
            git push origin HEAD:main
          fi
