name: Motor de blog (SEO/GEO)

# Miércoles 13:00 UTC → carril pimenton (1 post)
# Domingo 13:00 UTC → carril control-room (1 post)
# También: Actions → Run workflow (fresh, no "Re-run" de jobs viejos).
on:
  schedule:
    - cron: "0 13 * * 3"
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      command:
        description: "Qué ejecutar"
        required: true
        default: "run"
        type: choice
        options: [ideas, run, recover]
      lane:
        description: "Carril (solo para run/ideas manual)"
        required: true
        default: "pimenton"
        type: choice
        options: [pimenton, control-room, all]

permissions:
  contents: write

concurrency:
  group: motor-blog
  cancel-in-progress: false

jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias del motor
        working-directory: motor
        run: npm install

      - name: Resolver carril (Wed=pimenton / Sun=control-room)
        id: lane
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 13 * * 3" ]; then
              echo "lane=pimenton" >> "$GITHUB_OUTPUT"
            else
              echo "lane=control-room" >> "$GITHUB_OUTPUT"
            fi
          else
            INPUT="${{ github.event.inputs.lane }}"
            if [ "$INPUT" = "all" ]; then
              echo "lane=" >> "$GITHUB_OUTPUT"
            else
              echo "lane=$INPUT" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Ejecutar agentes (idean + redactan + generan HTML)
        working-directory: motor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: "https://pimenton.io"
          MAX_POSTS_PER_RUN: "1"
          LANE: ${{ steps.lane.outputs.lane }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
        run: npm run ${{ github.event.inputs.command || 'run' }}

      - name: Guardar HTML como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-output-${{ github.run_id }}
          path: |
            public/blog
            public/en/blog
            public/sitemap-blog.xml
            motor/data
            data/blog-teasers
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar blogs (commit a main)
        run: |
          set -euo pipefail
          git config user.name "motor-blog[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          OUT="/tmp/blog-publish-$$"
          mkdir -p "$OUT"
          cp -a public/blog "$OUT/blog"
          mkdir -p "$OUT/en" && cp -a public/en/blog "$OUT/en/blog"
          cp -a motor/data "$OUT/motor-data"
          cp -a data/blog-teasers "$OUT/blog-teasers"
          cp -a public/sitemap-blog.xml "$OUT/sitemap-blog.xml" 2>/dev/null || true

          publish_once() {
            git fetch origin main
            git reset --hard origin/main
            rm -rf public/blog public/en/blog
            mkdir -p public/en
            cp -a "$OUT/blog" public/blog
            cp -a "$OUT/en/blog" public/en/blog
            mkdir -p motor/data data/blog-teasers
            cp -a "$OUT/motor-data/." motor/data/
            cp -a "$OUT/blog-teasers/." data/blog-teasers/
            cp -a "$OUT/sitemap-blog.xml" public/sitemap-blog.xml 2>/dev/null || true

            git add public/blog public/en/blog public/sitemap-blog.xml motor/data data/blog-teasers
            if git diff --cached --quiet; then
              echo "Sin cambios que publicar."
              return 0
            fi
            if ! git diff --cached --quiet; then
              git commit -m "blog: nuevos posts generados por el motor" || true
            fi
            git push origin HEAD:main
          }

          for i in 1 2 3 4 5; do
            if publish_once; then
              echo "Publicado OK (intento $i)"
              exit 0
            fi
            echo "Push falló; reintento $i en 5s…"
            sleep 5
          done
          echo "No se pudo pushear tras 5 intentos (el artifact conserva los HTML)."
          exit 1
